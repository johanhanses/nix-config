onboarding = false

[theme]
# Solitude: "terminal" inherits Ghostty's ANSI palette (themes/solitude). The
# theme is the same in light and dark appearance, so both blocks below match.
name = "terminal"
auto_switch = false
dark_name = "terminal"
light_name = "terminal"

# Solitude's ANSI red is a dim grey, so failures get its one rust red and
# passes a light grey. Mirrors shared/ghostty/themes/solitude.
[theme.custom.dark]
accent = "#a8adb0"
red = "#de6145"
green = "#9fa5a9"

[theme.custom.light]
accent = "#a8adb0"
red = "#de6145"
green = "#9fa5a9"

[keys]
# same prefix as tmux (modules/home/tmux.nix)
prefix = "ctrl+a"

[ui.toast]
# background agent pop-ups as real macOS notifications (default: off)
delivery = "system"

[ui]
status_indicators = "symbols"
